<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="#0a0a0a"/>
  <!-- Subtle accent border -->
  <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="url(#accent)" stroke-width="5" opacity="0.35"/>
  <!-- P letterform with glow -->
  <text x="256" y="376" text-anchor="middle"
        font-family="'Sora', 'Inter', -apple-system, system-ui, sans-serif"
        font-weight="700" font-size="340"
        fill="url(#accent)" filter="url(#glow)">P</text>
</svg>
